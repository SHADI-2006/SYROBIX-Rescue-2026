; =============================================================================
;  SYROBIX Bench Tool — Wi-Fi edition | ESP32-S3
; =============================================================================
;  Build:  pio run -d bench_wifi           Flash: pio run -d bench_wifi -t upload
;
;  !!! PRACTICE ONLY. NEVER FLASH THIS FOR A COMPETITION ROUND. !!!
;  The rulebook (4.1) forbids passing information to the robot over wireless.
;  For a match, flash the normal firmware:  pio run -t upload  (project root).
;
;  Two modes in one image, switched by a reboot (see src/main.cpp):
;    BENCH : the bench tool (same as ../bench), reachable over Wi-Fi AND USB.
;    RUN   : the REAL match firmware from ../src (everything except its
;            main.cpp), plus a Wi-Fi page with START / STOP / live mission
;            state. One-shot: the next reset returns to BENCH.
;
;  Unlike ../bench, this project COMPILES ../src/*.cpp (for RUN mode), so it
;  only builds when the match firmware builds. ../bench stays independent.
; =============================================================================

[platformio]
default_envs = bench_wifi
core_dir     = ../.platformio

[env:bench_wifi]
platform        = espressif32 @ ^6.9.0
board           = esp32-s3-devkitc-1
framework       = arduino

monitor_speed   = 460800
upload_speed    = 921600

build_flags     =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
    -I../src
    ; links2004/WebSockets has no dependency list in its manifest, so the
    ; dependency finder never hands it the framework Wi-Fi headers. Give them
    ; to every translation unit explicitly.
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/WiFi/src
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/WiFiClientSecure/src
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/Network/src

; pre: turn ../bench/web/index.html (the same UI as the USB tool) into
;      src/index_html.h (gzipped, served by the robot)
; The match firmware is compiled through one-line wrappers src/fw_*.cpp.
extra_scripts   =
    pre:tools/embed_html.py

lib_deps =
    pololu/VL53L1X @ ^1.3.1
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit BusIO @ ^1.16.1
    links2004/WebSockets @ ^2.7.3
    ; framework libraries, listed so the dependency finder never misses one
    Wire
    WiFi
    WiFiClientSecure
    WebServer
    Preferences

; deep+: WebSockets.h picks its network stack with #if, which chain+ misses
lib_ldf_mode    = deep+
