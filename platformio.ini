; =============================================================================
;  SYROBIX Rescue Robot 2026 | ESP32-S3 | PlatformIO project configuration
; =============================================================================
;
;  Rev 3 — PCA9685 peripheral bus
;    REMOVED  madhephaestus/ESP32Servo          (servos are on the PCA9685)
;    REMOVED  pololu/VL53L0X                     (Rev 2: replaced by VL53L1X)
;    ADDED    adafruit/Adafruit PWM Servo Driver Library
;             (its dependency adafruit/Adafruit BusIO is pinned explicitly so
;              a fresh machine resolves the same version)
;
;  Layout: put every .h / .cpp from this firmware in  src/  next to this file.
;
;  CORE VERSION
;    espressif32 6.x ships Arduino-ESP32 core 2.0.17. RobotDrivetrain and
;    LidarBank also compile on core 3.x (the motor LEDC calls are version-
;    gated), but 2.0.17 is the configuration the firmware has been checked
;    against. Do not let the platform float to 7.x / core 3.x the week before
;    the competition.
;
;  SERIAL / USB (Rev 3 freed GPIO19/20 and GPIO43/44)
;    Default below: Serial = UART0 on GPIO43/44 = the DevKitC "UART"/"COM"
;    USB connector (CH343/CP210x bridge). Plug the cable into THAT port to see
;    telemetry. If you would rather use the native "USB" connector (GPIO19/20),
;    uncomment the two ARDUINO_USB_* flags in build_flags.
;
;  MODULE
;    board = esp32-s3-devkitc-1 uses its safe defaults (QIO flash, no PSRAM
;    init). The firmware does not use PSRAM, so this boots on N8, N16R8,
;    N8R2... alike. Only if you later need PSRAM on an N16R8 module, add:
;        board_build.arduino.memory_type = qio_opi
;        board_build.flash_size          = 16MB
;        board_upload.flash_size         = 16MB
;        build_flags += -DBOARD_HAS_PSRAM
;    (qio_opi on a quad-PSRAM module will NOT boot — check your module.)
; =============================================================================

[platformio]
default_envs = syrobix
; Keep the PlatformIO packages inside this project (shared by VS Code and the terminal).
core_dir     = .platformio

[env:syrobix]
platform        = espressif32 @ ^6.9.0
board           = esp32-s3-devkitc-1
framework       = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; The firmware is C++11-clean (it is checked with -std=gnu++11), so the
; core's default language standard is left alone.
build_flags     =
    -Wall
    -Wextra
    ; 1 = errors only, 2 = + warnings. Keep at 1 for matches: the Adafruit
    ; library's re-init path calls Wire.begin() on an already-running bus,
    ; which Arduino-ESP32 logs as a (harmless) warning.
    -DCORE_DEBUG_LEVEL=1
    ; --- Native USB for Serial instead of the UART bridge (see header) ---
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    pololu/VL53L1X @ ^1.3.1
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit BusIO @ ^1.16.1

; Wire.h, SPI.h and the FreeRTOS headers come from the Arduino core itself.
lib_ldf_mode    = chain+
