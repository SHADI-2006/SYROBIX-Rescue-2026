; =============================================================================
;  SYROBIX Bench Tool | ESP32-S3 | standalone hardware test firmware
; =============================================================================
;  Build:   pio run -d bench            Flash: pio run -d bench -t upload
;
;  This project is INDEPENDENT of the match firmware in ../src. It shares only
;  ../src/Config.h (pins, addresses, limits), which is a pure constants header
;  with no includes besides <stdint.h>. No other firmware file is compiled, so
;  a broken TaskHandler.cpp / LidarBank.cpp etc. cannot break this build.
;
;  Platform and library versions are pinned to the same ranges as the match
;  firmware, so both talk to the hardware through the same driver code.
; =============================================================================

[platformio]
default_envs = bench
; Reuse the packages the main project already downloaded (../.platformio).
core_dir     = ../.platformio

[env:bench]
platform        = espressif32 @ ^6.9.0
board           = esp32-s3-devkitc-1
framework       = arduino

monitor_speed   = 460800
upload_speed    = 921600

build_flags     =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
    ; Config.h only. Nothing else from ../src is on the include path's
    ; compile list (build_src_filter below keeps ../src out of the build).
    -I../src

build_src_filter = +<*>

lib_deps =
    pololu/VL53L1X @ ^1.3.1
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit BusIO @ ^1.16.1

lib_ldf_mode    = chain+
